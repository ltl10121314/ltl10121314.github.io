  var container = document.getElementById('tcomment');
  if (!container || typeof twikoo === 'undefined') return;

  var endpoint = 'https://twikoo.liutianlong.top';
  var language = document.documentElement.getAttribute('data-lang') === 'en' ? 'en' : 'zh';
  var labels = language === 'en'

        failed: 'The comment service is temporarily unavailable.',
        retry: 'Reconnect'

        retrying: '留言服务响应较慢，正在自动重新连接…',
        failed: '留言服务暂时不可用。',
        retry: '重新连接'
      };
  var options = {
    envId: endpoint,
    el: '#tcomment',

  var adminCrypt = '';
  try {
    adminCrypt = '\u4e91\u8d77\u8fce\u98ce\u71d5';
  } catch (error) {}
  var attempts = 0;
  var maxAttempts = 3;
  var retryTimer = null;
  var fatalShown = false;
  var observer = null;

  function clearElement(element) {
    while (element.firstChild) element.removeChild(element.firstChild);
  }

  function statusNode() {
    var node = container.querySelector('.twikoo-connection-status');
    if (node) return node;
    node = document.createElement('div');

      button.addEventListener('click', function() {

        retryCommentService();

      node.appendChild(button);
