<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">文件上传流程</title>
  <desc id="desc">客户端计算文件 SHA1，服务端查询元数据；已存在则秒传，否则执行分片上传、合并与元数据落库。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfcff"/>
      <stop offset="1" stop-color="#eff5fa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#173c5a" flood-opacity=".1"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#7891a7"/>
    </marker>
    <style>
      .title{font:700 32px "PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#17324d}
      .subtitle{font:400 16px "PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#66788a}
      .step{font:700 17px "PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#17324d}
      .body{font:400 13px "PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#697c8e}
      .code{font:600 13px Menlo,Consolas,monospace;fill:#2c6698}
    </style>
  </defs>
  <rect width="1200" height="640" rx="28" fill="url(#bg)"/>
  <text x="70" y="72" class="title">文件上传与秒传流程</text>
  <text x="70" y="102" class="subtitle">以文件 SHA1 为索引，避免重复存储并支持大文件续传</text>

  <g filter="url(#shadow)">
    <rect x="70" y="160" width="190" height="152" rx="20" fill="#fff"/>
    <text x="98" y="200" class="step">1 · 客户端</text>
    <text x="98" y="234" class="body">读取文件并计算 SHA1</text>
    <rect x="98" y="254" width="134" height="30" rx="8" fill="#eef4ff"/>
    <text x="114" y="274" class="code">sha1(file)</text>
  </g>

  <line x1="270" y1="236" x2="322" y2="236" stroke="#7891a7" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="334" y="160" width="210" height="152" rx="20" fill="#fff"/>
    <text x="362" y="200" class="step">2 · 查询元数据</text>
    <text x="362" y="234" class="body">按 file_sha1 查询记录</text>
    <rect x="362" y="254" width="154" height="30" rx="8" fill="#eef4ff"/>
    <text x="378" y="274" class="code">SELECT t_file</text>
  </g>

  <line x1="554" y1="236" x2="606" y2="236" stroke="#7891a7" stroke-width="3" marker-end="url(#arrow)"/>

  <g>
    <path d="M706 178l58 58-58 58-58-58z" fill="#fff2dc" stroke="#e2a43b" stroke-width="2"/>
    <text x="678" y="231" class="step">已存在？</text>
    <path d="M764 236h58" fill="none" stroke="#7891a7" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="778" y="220" class="body">是</text>
    <path d="M706 294v54h-52" fill="none" stroke="#7891a7" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="714" y="330" class="body">否</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="834" y="160" width="296" height="152" rx="20" fill="#fff"/>
    <text x="862" y="200" class="step">秒传完成</text>
    <text x="862" y="234" class="body">直接写入用户与文件关系</text>
    <text x="862" y="264" class="body">无需再次上传文件内容</text>
    <circle cx="1088" cy="284" r="14" fill="#3eb59f"/>
    <path d="M1081 284l5 5 9-11" fill="none" stroke="#fff" stroke-width="2.5"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="334" y="384" width="796" height="184" rx="22" fill="#fff"/>
    <text x="362" y="424" class="step">分片上传</text>
    <text x="446" y="424" class="body">文件不存在时，按固定大小切分并记录已上传分片</text>
    <g>
      <rect x="362" y="456" width="130" height="48" rx="10" fill="#eaf5ff"/>
      <text x="386" y="486" class="body">Chunk 1</text>
      <rect x="506" y="456" width="130" height="48" rx="10" fill="#eaf5ff"/>
      <text x="530" y="486" class="body">Chunk 2</text>
      <rect x="650" y="456" width="130" height="48" rx="10" fill="#eaf5ff"/>
      <text x="674" y="486" class="body">Chunk 3</text>
      <rect x="794" y="456" width="130" height="48" rx="10" fill="#f5f8fa"/>
      <text x="818" y="486" class="body">...</text>
      <line x1="940" y1="480" x2="980" y2="480" stroke="#7891a7" stroke-width="3" marker-end="url(#arrow)"/>
      <rect x="990" y="456" width="112" height="48" rx="10" fill="#e8f7f2"/>
      <text x="1014" y="486" class="body">合并文件</text>
    </g>
    <text x="362" y="540" class="body">合并成功后写入元数据，并返回文件访问地址；失败时保留已完成分片，便于续传。</text>
  </g>
</svg>
