<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">云存储系统架构</title>
  <desc id="desc">客户端经 Web 与 API 层访问元数据数据库和分布式文件存储，实现文件管理、秒传和分片上传。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#eef5f8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#173c5a" flood-opacity=".11"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#7793aa"/>
    </marker>
    <style>
      .title{font:700 32px "PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#17324d}
      .subtitle{font:400 16px "PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#66788a}
      .heading{font:700 19px "PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#17324d}
      .label{font:600 14px "PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#315674}
      .body{font:400 13px "PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#6b7d8e}
    </style>
  </defs>
  <rect width="1200" height="700" rx="28" fill="url(#bg)"/>
  <text x="70" y="72" class="title">企业级云存储系统架构</text>
  <text x="70" y="102" class="subtitle">业务服务与文件存储分离，元数据和真实文件分别管理</text>

  <g filter="url(#shadow)">
    <rect x="70" y="170" width="210" height="220" rx="22" fill="#fff"/>
    <text x="98" y="214" class="heading">客户端</text>
    <rect x="98" y="242" width="154" height="48" rx="12" fill="#edf5ff"/>
    <text x="124" y="272" class="label">Web / App</text>
    <text x="98" y="326" class="body">上传 · 下载 · 查询 · 删除</text>
    <text x="98" y="354" class="body">分片与断点续传</text>
  </g>

  <line x1="290" y1="280" x2="350" y2="280" stroke="#7793aa" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="360" y="144" width="250" height="272" rx="24" fill="#fff"/>
    <text x="390" y="188" class="heading">业务服务层</text>
    <rect x="390" y="214" width="190" height="42" rx="10" fill="#eef6ff"/>
    <text x="414" y="240" class="label">文件服务</text>
    <rect x="390" y="270" width="190" height="42" rx="10" fill="#eef6ff"/>
    <text x="414" y="296" class="label">用户服务</text>
    <rect x="390" y="326" width="190" height="42" rx="10" fill="#eef6ff"/>
    <text x="414" y="352" class="label">鉴权与配额</text>
    <text x="390" y="394" class="body">统一 API 与业务规则</text>
  </g>

  <path d="M610 250h74v-72h56" fill="none" stroke="#7793aa" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M610 318h74v72h56" fill="none" stroke="#7793aa" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="754" y="120" width="376" height="166" rx="22" fill="#fff"/>
    <text x="784" y="162" class="heading">元数据存储 · MySQL</text>
    <text x="784" y="194" class="body">t_file：文件名 / SHA1 / 大小 / 地址 / 状态</text>
    <text x="784" y="224" class="body">t_user_file：用户与文件归属关系</text>
    <rect x="784" y="242" width="314" height="20" rx="10" fill="#dfeefa"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="754" y="356" width="376" height="166" rx="22" fill="#fff"/>
    <text x="784" y="398" class="heading">文件存储 · FastDFS</text>
    <text x="784" y="430" class="body">Tracker 调度 · Storage 集群存储</text>
    <text x="784" y="460" class="body">主从同步 · 分组扩容 · Nginx 提供访问</text>
    <rect x="784" y="478" width="314" height="20" rx="10" fill="#dff3ee"/>
  </g>

  <g>
    <rect x="70" y="500" width="610" height="112" rx="20" fill="#17324d"/>
    <text x="98" y="538" class="heading" fill="#fff">项目关键能力</text>
    <g fill="#d7e7f4" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="14">
      <text x="100" y="574">SHA1 秒传</text>
      <text x="220" y="574">分片上传</text>
      <text x="330" y="574">断点续传</text>
      <text x="440" y="574">文件权限</text>
      <text x="545" y="574">容量统计</text>
    </g>
  </g>
</svg>
