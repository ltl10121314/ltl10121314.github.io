<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">FastDFS 架构</title>
  <desc id="desc">客户端通过 Tracker 集群获取 Storage 地址，再在 Storage Group 中完成文件上传、下载与同步。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#eef5fb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#183b5b" flood-opacity=".11"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#7892a9"/>
    </marker>
    <style>
      .title{font:700 32px "PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#17324d}
      .subtitle{font:400 16px "PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#66788a}
      .heading{font:700 20px "PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#17324d}
      .label{font:600 15px "PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#2f506d}
      .body{font:400 13px "PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#697c8e}
    </style>
  </defs>
  <rect width="1200" height="700" rx="28" fill="url(#bg)"/>
  <circle cx="1080" cy="80" r="120" fill="#dceeff"/>
  <text x="70" y="72" class="title">FastDFS 分布式文件系统</text>
  <text x="70" y="102" class="subtitle">Tracker 负责调度和负载均衡，Storage 负责文件存储与同步</text>

  <g filter="url(#shadow)">
    <rect x="70" y="190" width="210" height="210" rx="22" fill="#fff"/>
    <circle cx="175" cy="250" r="34" fill="#e8f2fd"/>
    <path d="M160 240h30v38h-30z" fill="none" stroke="#3777b8" stroke-width="4" rx="4"/>
    <path d="M166 250h18M166 258h18M166 266h12" stroke="#3777b8" stroke-width="3" stroke-linecap="round"/>
    <text x="126" y="314" class="heading">客户端</text>
    <text x="112" y="340" class="body">上传 / 下载 / 删除</text>
    <text x="112" y="366" class="body">携带文件元数据</text>
  </g>

  <line x1="290" y1="294" x2="390" y2="294" stroke="#7892a9" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="402" y="160" width="290" height="270" rx="24" fill="#fff"/>
    <text x="432" y="204" class="heading">Tracker 集群</text>
    <text x="432" y="230" class="body">对等节点，可按压力横向扩容</text>
    <rect x="432" y="258" width="230" height="54" rx="13" fill="#e9f4ff"/>
    <text x="464" y="291" class="label">Tracker 1 · :22122</text>
    <rect x="432" y="326" width="230" height="54" rx="13" fill="#e9f4ff"/>
    <text x="464" y="359" class="label">Tracker 2 · :22122</text>
    <text x="432" y="408" class="body">返回可用 Storage 地址</text>
  </g>

  <path d="M690 294h70v-112" fill="none" stroke="#7892a9" stroke-width="3"/>
  <path d="M760 182h44" fill="none" stroke="#7892a9" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M690 294h70v188" fill="none" stroke="#7892a9" stroke-width="3"/>
  <path d="M760 482h44" fill="none" stroke="#7892a9" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="704" y="280" class="body">定位组</text>

  <g filter="url(#shadow)">
    <rect x="810" y="132" width="320" height="220" rx="24" fill="#fff"/>
    <text x="840" y="176" class="heading">Storage Group 1</text>
    <text x="840" y="202" class="body">组内文件冗余同步</text>
    <rect x="840" y="228" width="260" height="44" rx="11" fill="#e8f6f2"/>
    <text x="864" y="255" class="label">Storage A · master</text>
    <rect x="840" y="284" width="260" height="44" rx="11" fill="#f3f8f7"/>
    <text x="864" y="311" class="label">Storage B · replica</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="810" y="390" width="320" height="220" rx="24" fill="#fff"/>
    <text x="840" y="434" class="heading">Storage Group 2</text>
    <text x="840" y="460" class="body">组之间相互独立，可线性扩容</text>
    <rect x="840" y="486" width="260" height="44" rx="11" fill="#e8f6f2"/>
    <text x="864" y="513" class="label">Storage C · master</text>
    <rect x="840" y="542" width="260" height="44" rx="11" fill="#f3f8f7"/>
    <text x="864" y="569" class="label">Storage D · replica</text>
  </g>

  <g>
    <rect x="70" y="474" width="640" height="116" rx="20" fill="#17324d"/>
    <text x="98" y="510" class="heading" fill="#fff">文件访问流程</text>
    <text x="98" y="540" class="label" fill="#d7e5f2">1. 向 Tracker 查询 Storage</text>
    <text x="98" y="568" class="label" fill="#d7e5f2">2. 直接上传或下载文件，返回 file_id / 内容</text>
    <text x="520" y="540" class="body" fill="#a9c2d8">Nginx 可代理 HTTP 访问</text>
  </g>
</svg>
