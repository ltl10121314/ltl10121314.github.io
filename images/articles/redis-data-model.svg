<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Redis 数据模型</title>
  <desc id="desc">Redis 客户端通过事件循环访问内存中的 16 个逻辑数据库，并支持五种常用数据类型。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#edf4fa"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2d6cdf"/>
      <stop offset="1" stop-color="#35a5b7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#183b56" flood-opacity=".11"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#7c91a6"/>
    </marker>
    <style>
      .title{font:700 32px "PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#17324d}
      .subtitle{font:400 16px "PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#66788a}
      .card-title{font:700 20px "PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#17324d}
      .label{font:600 15px "PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#2e4b66}
      .small{font:400 13px "PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#6b7d8e}
    </style>
  </defs>
  <rect width="1200" height="680" rx="28" fill="url(#bg)"/>
  <circle cx="1090" cy="72" r="112" fill="#dbeafe" opacity=".8"/>
  <circle cx="90" cy="620" r="130" fill="#dff5f0" opacity=".7"/>
  <text x="70" y="74" class="title">Redis 数据模型</text>
  <text x="70" y="104" class="subtitle">单线程事件循环 · 内存数据库 · 多种数据结构</text>

  <g filter="url(#shadow)">
    <rect x="70" y="156" width="230" height="188" rx="20" fill="#fff"/>
    <rect x="70" y="156" width="230" height="8" rx="4" fill="#2d6cdf"/>
    <text x="98" y="198" class="card-title">客户端</text>
    <rect x="98" y="222" width="174" height="38" rx="10" fill="#eef4ff"/>
    <text x="122" y="247" class="label">Java / Jedis</text>
    <rect x="98" y="270" width="174" height="38" rx="10" fill="#eef4ff"/>
    <text x="122" y="295" class="label">CLI / 其他语言</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="370" y="156" width="250" height="188" rx="20" fill="#fff"/>
    <rect x="370" y="156" width="250" height="8" rx="4" fill="#35a5b7"/>
    <text x="398" y="198" class="card-title">事件循环</text>
    <circle cx="430" cy="256" r="36" fill="#e2f7f5"/>
    <path d="M430 232a24 24 0 1 1-20 11" fill="none" stroke="#2c9c92" stroke-width="5" stroke-linecap="round"/>
    <path d="M410 235l-2 11 11-2" fill="#2c9c92"/>
    <text x="486" y="248" class="label">epoll 多路复用</text>
    <text x="486" y="273" class="label">单线程处理命令</text>
    <text x="486" y="298" class="small">避免锁竞争，保证顺序</text>
  </g>

  <line x1="306" y1="250" x2="360" y2="250" stroke="#7c91a6" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="626" y1="250" x2="692" y2="250" stroke="#7c91a6" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="700" y="138" width="430" height="322" rx="22" fill="#fff"/>
    <text x="730" y="181" class="card-title">内存数据空间</text>
    <text x="730" y="207" class="small">默认 16 个逻辑数据库，索引从 0 开始</text>
    <g>
      <rect x="730" y="230" width="175" height="70" rx="14" fill="#eef4ff"/>
      <text x="752" y="260" class="label">DB 0</text>
      <text x="752" y="284" class="small">默认连接库</text>
      <rect x="925" y="230" width="175" height="70" rx="14" fill="#f5f8fb"/>
      <text x="947" y="260" class="label">DB 1-14</text>
      <text x="947" y="284" class="small">业务隔离</text>
    </g>
    <rect x="730" y="320" width="370" height="104" rx="16" fill="#f8fbff" stroke="#dce8f3"/>
    <text x="752" y="350" class="label">常用数据类型</text>
    <g class="small">
      <text x="752" y="382">String</text>
      <text x="850" y="382">Hash</text>
      <text x="941" y="382">List</text>
      <text x="1024" y="382">Set</text>
      <text x="752" y="407">ZSet · Bitmap · HyperLogLog · GEO</text>
    </g>
  </g>

  <g>
    <rect x="70" y="482" width="1060" height="124" rx="20" fill="#17324d"/>
    <text x="98" y="520" class="title" fill="#fff" style="font-size:20px">典型使用场景</text>
    <g fill="#e7f0f8" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="15">
      <text x="100" y="558">热点缓存</text>
      <text x="250" y="558">排行榜</text>
      <text x="380" y="558">会话共享</text>
      <text x="540" y="558">任务队列</text>
      <text x="700" y="558">访问统计</text>
      <text x="870" y="558">过期控制</text>
    </g>
    <g fill="#52a8c3">
      <circle cx="118" cy="584" r="4"/><circle cx="268" cy="584" r="4"/><circle cx="398" cy="584" r="4"/>
      <circle cx="558" cy="584" r="4"/><circle cx="718" cy="584" r="4"/><circle cx="888" cy="584" r="4"/>
    </g>
  </g>
</svg>
