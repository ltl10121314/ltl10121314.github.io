<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Spring IOC 概览</title>
  <desc id="desc">比较传统硬编码依赖与 Spring IOC 容器管理对象的依赖注入方式。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9fcfb"/>
      <stop offset="1" stop-color="#edf4f1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#163b2f" flood-opacity=".1"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#78918a"/>
    </marker>
    <style>
      .title{font:700 32px "PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#17352f}
      .subtitle{font:400 16px "PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#667c76}
      .heading{font:700 20px "PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#193c34}
      .label{font:600 15px "PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#31554d}
      .body{font:400 13px "PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#6b817b}
      .module{font:600 14px "PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#285c50}
    </style>
  </defs>
  <rect width="1200" height="720" rx="28" fill="url(#bg)"/>
  <circle cx="1080" cy="90" r="120" fill="#dff2e8"/>
  <text x="70" y="72" class="title">Spring IOC 与依赖解耦</text>
  <text x="70" y="102" class="subtitle">把对象创建和依赖关系交给容器管理，让上层组件依赖接口而不是具体实现</text>

  <g filter="url(#shadow)">
    <rect x="70" y="154" width="460" height="330" rx="24" fill="#fff"/>
    <text x="98" y="198" class="heading">传统硬编码</text>
    <text x="98" y="225" class="body">组件自行创建下游对象，耦合度高</text>
    <rect x="120" y="254" width="340" height="52" rx="12" fill="#f3f7f6"/>
    <text x="250" y="287" class="label">UserAction</text>
    <rect x="120" y="332" width="340" height="52" rx="12" fill="#f3f7f6"/>
    <text x="250" y="365" class="label">UserService</text>
    <rect x="120" y="410" width="340" height="52" rx="12" fill="#f3f7f6"/>
    <text x="250" y="443" class="label">UserDAO</text>
    <line x1="290" y1="306" x2="290" y2="326" stroke="#78918a" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="290" y1="384" x2="290" y2="404" stroke="#78918a" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="308" y="321" class="body">new UserService()</text>
    <text x="308" y="399" class="body">new UserDAO()</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="600" y="154" width="530" height="330" rx="24" fill="#fff"/>
    <text x="628" y="198" class="heading">Spring IOC 容器</text>
    <text x="628" y="225" class="body">容器负责创建、装配和管理 Bean 生命周期</text>
    <rect x="632" y="254" width="466" height="96" rx="18" fill="#e5f4ed" stroke="#b6dccb"/>
    <text x="660" y="288" class="label">ApplicationContext</text>
    <text x="660" y="316" class="body">读取配置 · 创建 Bean · 注入依赖 · 管理作用域</text>
    <line x1="750" y1="350" x2="750" y2="382" stroke="#78918a" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="914" y1="350" x2="914" y2="382" stroke="#78918a" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="638" y="390" width="224" height="58" rx="13" fill="#f8faf9"/>
    <text x="686" y="425" class="label">UserService</text>
    <rect x="878" y="390" width="224" height="58" rx="13" fill="#f8faf9"/>
    <text x="930" y="425" class="label">UserDAO</text>
    <text x="640" y="472" class="body">面向接口编程，替换实现时无需修改调用方</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="70" y="534" width="1060" height="116" rx="22" fill="#173d33"/>
    <text x="98" y="570" class="heading" fill="#fff">Spring 核心模块</text>
    <g>
      <rect x="98" y="588" width="142" height="36" rx="18" fill="#246354"/>
      <text x="130" y="611" class="module" fill="#fff">Core Container</text>
      <rect x="258" y="588" width="122" height="36" rx="18" fill="#246354"/>
      <text x="286" y="611" class="module" fill="#fff">AOP</text>
      <rect x="398" y="588" width="122" height="36" rx="18" fill="#246354"/>
      <text x="426" y="611" class="module" fill="#fff">Data Access</text>
      <rect x="538" y="588" width="122" height="36" rx="18" fill="#246354"/>
      <text x="574" y="611" class="module" fill="#fff">Web</text>
      <rect x="678" y="588" width="122" height="36" rx="18" fill="#246354"/>
      <text x="704" y="611" class="module" fill="#fff">Test</text>
      <rect x="818" y="588" width="282" height="36" rx="18" fill="#246354"/>
      <text x="846" y="611" class="module" fill="#fff">Integration · Messaging · Batch</text>
    </g>
  </g>
</svg>
